<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spore Designer</title>
    <meta name="description" content="Design procedural moulds by twiddling parameters, from plain fluff to lurid lichen blooms." />
    <link rel="icon" href="data:," />
    <!-- trunk: build this crate's binary to wasm (the `web` cargo profile), and copy the (empty) asset
         manifest the toolkit looks for. -->
    <link data-trunk rel="rust" data-bin="spore-designer" data-cargo-profile="web" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #3e4248; }
      /* The app fills the window; keyboard focus stays on it without a focus ring, and touches
         go to the app instead of scrolling or zooming the page. */
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="designer" tabindex="0"></canvas>
  </body>
</html>
