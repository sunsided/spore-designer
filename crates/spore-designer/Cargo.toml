[package]
name = "spore-designer"
description = "Design procedural moulds by twiddling parameters, with live lighting and map export; native and in the browser"
keywords = ["procedural", "mold", "editor", "egui", "gamedev"]
categories = ["game-development", "graphics", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
publish.workspace = true

[dependencies]
spore-core = { workspace = true }
game-toolkit = { version = "0.11", features = ["ui"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ron = { workspace = true }
serde = { workspace = true }
rfd = "0.15"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# In the browser: downloads for saving, async file picking for loading. (The toolkit logs to
# the browser console itself.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "HtmlAnchorElement", "Url", "Window"] }
